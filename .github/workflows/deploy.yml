name: КЕГЭ · GitHub Pages
on:
  push:
    branches: [main]
    paths: ['kege-platform/**', '.github/workflows/deploy.yml', 'kege-source.tar.gz']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kege-platform
    steps:
      - uses: actions/checkout@v4
      - name: Import initial source archive
        if: hashFiles('kege-platform/package.json') == ''
        working-directory: .
        run: tar -xzf kege-source.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kege-platform/package-lock.json
      - run: npm ci
      - run: npm run test:security
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kege-platform/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
